name: Build and release APK

on:
  push:
    branches: [main]
    # The desktop app has its own workflow – no new Android release for desktop-only changes.
    paths-ignore: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing key missing. Add the repository secrets SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD (Settings > Secrets and variables > Actions), then re-run this workflow."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sublens-release.jks"
          echo "SUBLENS_KEYSTORE=$RUNNER_TEMP/sublens-release.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "SUBLENS_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build APK
        run: |
          chmod +x gradlew
          if ! ./gradlew testReleaseUnitTest assembleRelease --console=plain > build.log 2>&1; then
            cat build.log
            # Errors as annotations so they show up without downloading the log
            grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception" build.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          tail -5 build.log
          cp app/build/outputs/apk/release/app-release.apk SubLens.apk

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SubLens 0.2.${{ github.run_number }}
          make_latest: true
          files: SubLens.apk
          body: |
            **Install:** on your Android phone, tap **SubLens.apk** below → download → open → *Install*.
            The first time, Android asks whether your browser may install apps → allow it.

            Already have SubLens? It offers this update itself (button at the bottom of the app). Settings are kept.

            Download page: https://elphax89.github.io/sublense/

      - uses: actions/upload-artifact@v4
        with:
          name: SubLens-APK
          path: SubLens.apk

  # Download page (GitHub Pages). Independent: if Pages is not enabled, the APK is still published.
  pages:
    needs: apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
