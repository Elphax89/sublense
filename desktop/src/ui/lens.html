<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:">
<title>SubLens Lens</title>
<link rel="stylesheet" href="lens.css">
</head>
<body>
<div id="wrap">
  <div id="frame">
    <svg id="border"></svg>
    <div id="boxes"></div>
    <div id="status" data-hit><span id="statusText"></span><button id="statusBtn" hidden></button></div>
    <button id="move" class="round" data-hit title="Move">
      <svg viewBox="0 0 24 24"><path d="M12 2l3 3h-2v6h6V9l3 3-3 3v-2h-6v6h2l-3 3-3-3h2v-6H5v2l-3-3 3-3v2h6V5H9z"/></svg>
    </button>
    <div id="ctl" data-hit>
      <button id="btnVideo" title="Video"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6H4zm6 2.5 5.5 3.5-5.5 3.5z"/></svg></button>
      <button id="btnSwap" title="Swap"><svg viewBox="0 0 24 24"><path d="M8 3 3.5 7.5l1.4 1.4L7 6.8V16h2V6.8l2.1 2.1 1.4-1.4zm7 5v9.2l-2.1-2.1-1.4 1.4L16 21l4.5-4.5-1.4-1.4-2.1 2.1V8z"/></svg></button>
      <button id="btnSettings" title="Settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54a7 7 0 0 0-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.72 8.47a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button>
      <button id="btnClose" title="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    </div>
    <div id="grip" data-hit title="Resize"><svg viewBox="0 0 12 12"><path d="M11 3 3 11M11 7 7 11"/></svg></div>
  </div>
  <div id="composer" data-hit>
    <div id="cLeft"><div id="chip"></div><button id="peek"></button></div>
    <input id="input" type="text" autocomplete="off" spellcheck="true">
    <button id="copy" title="Copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 5V4a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h1"/></svg></button>
  </div>
</div>
<video id="video" muted playsinline></video>
<script src="lens.js"></script>
</body>
</html>
